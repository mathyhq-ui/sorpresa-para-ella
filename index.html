<!DOCTYPE html><html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Para la mujer que más amo</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#090507;color:#fff;font-family:Arial,sans-serif}section{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 18px}.inicio{background:radial-gradient(circle,#3a0b1c,#090507 65%)}h1,h2,h3{font-family:Georgia,serif}.inicio h1{font-size:clamp(42px,8vw,82px);line-height:.95}.btn{border:1px solid #ffffff55;background:#ff406522;color:white;border-radius:50%;width:58px;height:58px;font-size:26px;cursor:pointer;margin:12px;padding:0;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 24px #ff406522}.contador-titulo{font-family:Georgia,serif;font-size:clamp(25px,4vw,34px);font-weight:bold;margin:24px auto 8px}.contador-inicio{margin:0 auto;padding:24px 30px 18px;border:1px solid #ffffff25;border-radius:22px;background:#ffffff0a;backdrop-filter:blur(6px);box-shadow:0 10px 35px #00000055;max-width:560px}.contador-inicio .numero{display:flex;align-items:flex-end;justify-content:center;gap:22px}.contador-inicio .grupo{display:flex;flex-direction:column;align-items:center;gap:9px}.contador-inicio .etiqueta{font-family:Georgia,serif;font-size:19px;color:#ffffffcc;order:-1}.contador-inicio .caja-numero{display:flex;align-items:center;justify-content:center;min-width:82px;padding:13px 18px;border:1px solid #ffffff25;border-radius:16px;background:#ffffff0c;font-family:Georgia,serif;font-size:34px;line-height:1;color:#fff;box-shadow:inset 0 0 18px #00000022}.contador-inicio .separador{font-family:Georgia,serif;font-size:28px;color:#ffffffaa;margin-bottom:10px}.contador-fecha{font-family:Georgia,serif;font-size:15px;color:#ffffffaa;margin-top:18px}.sorpresa{display:none;padding:55px 18px;min-height:100vh;background:radial-gradient(circle at top,#260b18,#090507 60%)}.sorpresa.show{display:block}.wrap{max-width:1000px;margin:auto}.catalogo-titulo{font-size:clamp(34px,6vw,52px);margin:10px 0 8px}.catalogo-subtitulo{color:#ffffffaa;font-family:Georgia,serif;margin:0 0 35px}.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;text-align:left}.carta-card{position:relative;min-height:180px;padding:28px 24px;border:1px solid #ffffff20;border-radius:22px;background:#ffffff0b;box-shadow:0 12px 35px #00000045;cursor:pointer;transition:.25s}.carta-card:hover{transform:translateY(-4px);background:#ffffff12}.carta-card h3{margin:0 0 12px;font-size:25px}.carta-card p{margin:0;color:#ffffffaa;line-height:1.5}.carta-card .corazon-card{position:absolute;right:18px;top:16px;color:#ff668c}.lector{display:none;max-width:800px;margin:35px auto 0;padding:35px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff0b;text-align:left}.lector.show{display:block}.lector h2{text-align:center;font-size:38px}.lector p{font-family:Georgia,serif;font-size:18px;line-height:1.8;white-space:pre-line}.volver{display:block;margin:25px auto 0;border:1px solid #ffffff30;background:#ffffff0a;color:white;border-radius:20px;padding:10px 18px;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#000000b8;z-index:10;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{width:min(620px,100%);padding:28px;border:1px solid #ffffff25;border-radius:24px;background:#180b11;box-shadow:0 20px 60px #000}.modal-box h2{margin-top:0;text-align:center}.modal-box input,.modal-box textarea{width:100%;margin:8px 0 14px;padding:13px;border:1px solid #ffffff22;border-radius:12px;background:#ffffff0a;color:white;font:inherit}.modal-box textarea{min-height:180px;resize:vertical}.acciones{display:flex;gap:10px;justify-content:flex-end}.acciones button{border:1px solid #ffffff25;background:#ffffff0b;color:white;border-radius:14px;padding:10px 17px;cursor:pointer}.acciones .guardar{background:#ff406522}.extras{margin:45px auto 0;display:grid;gap:14px;max-width:560px}.extra-btn{padding:15px;border:1px solid #ffffff25;border-radius:18px;background:#ffffff0a;color:#fff;font:inherit;cursor:pointer}.extra-btn:hover{background:#ffffff14}.contador-especial{margin-top:10px;display:grid;gap:3px}.contador-especial b{font-family:Georgia,serif;font-size:13px;font-weight:normal;color:#ffffffaa}.contador-especial small{font-size:11px;color:#ffffff66}.recuerdos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:18px}.recuerdo{min-height:140px;border-radius:16px;overflow:hidden;border:1px solid #ffffff20;background:#ffffff08}.recuerdo img{width:100%;height:100%;object-fit:cover;display:block}.secreta{padding:18px;border:1px solid #ffffff18;border-radius:18px;background:#ffffff08;margin-top:15px}.secreta button{margin-top:12px}.final{text-align:center;padding:70px 20px}.final h3{font-size:clamp(16px,2vw,22px);font-weight:normal;color:#ffffff55;margin:0}.heart{color:#ff668c}.float{position:fixed;bottom:-20px;color:#ff668c;animation:up 7s linear forwards}@keyframes up{to{transform:translateY(-110vh);opacity:0}}
.boton-agregar{position:fixed;right:18px;bottom:18px;width:42px;height:42px;border:1px solid #ffffff45;border-radius:50%;background:#180b11cc;color:#ff668c;font-size:27px;line-height:1;cursor:pointer;z-index:9;display:none;align-items:center;justify-content:center;box-shadow:0 5px 22px #00000066;backdrop-filter:blur(5px)}.sorpresa.show~.boton-agregar{display:flex}.boton-agregar:hover{transform:scale(1.06);background:#24101acc}.boton-eliminar{position:fixed;right:18px;bottom:68px;width:42px;height:42px;border:1px solid #ffffff45;border-radius:50%;background:#180b11cc;color:#ff668c;font-size:20px;cursor:pointer;z-index:9;display:none;align-items:center;justify-content:center;box-shadow:0 5px 22px #00000066;backdrop-filter:blur(5px)}.sorpresa.show~.boton-eliminar{display:flex}.boton-eliminar:hover{transform:scale(1.06);background:#24101acc}.eliminar-carta{position:absolute;right:14px;bottom:14px;width:32px;height:32px;border:1px solid #ffffff35;border-radius:50%;background:#2a0d18;color:#ff668c;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style></head><body>
<section class="inicio" id="inicio"><div><p>Una pequeña parte de todo lo que siento</p><h1>Para la mujer<br>que más amo <span class="heart">💗</span></h1><button class="btn" onclick="abrir()" aria-label="Abrir sorpresa">💌</button><div class="contador-titulo">Juntos desde hace</div><div class="contador-inicio"><div class="numero" id="contador">Calculando...</div><div class="contador-fecha">12/03/2026</div><div class="contador-especial inicio-especial"><b>Y cada día contigo cuenta.</b><small id="diasTotalesInicio"></small></div></div></div></section>

<section class="sorpresa" id="sorpresa"><div class="wrap">
<h1 class="catalogo-titulo">Mis cartas para ti 💗</h1><p class="catalogo-subtitulo">Cada una guarda algo que quería decirte.</p>
<div class="cartas" id="cartas"></div>
<div class="lector" id="lector"><h2 id="lectorTitulo"></h2><p id="lectorTexto"></p><button class="volver" onclick="cerrarCarta()">← Volver a mis cartas</button></div>
<div class="final"><h3>Te amo sarnosa 💗 🐵</h3></div>
</div></section>
<div class="modal" id="extrasModal"><div class="modal-box"><button class="volver" onclick="cerrarExtras()">← Volver</button><div id="extrasContenido"></div></div></div>

<button class="boton-agregar" onclick="abrirAgregar()" aria-label="Agregar carta">+</button><button class="boton-eliminar" onclick="activarEliminacion()" aria-label="Eliminar cartas">🗑</button>
<div class="modal" id="modal"><div class="modal-box"><h2>Agregar una carta 💗</h2><input id="nuevoTitulo" placeholder="Título de la carta"><textarea id="nuevoTexto" placeholder="Escribe aquí tu carta..."></textarea><div class="acciones"><button onclick="cerrarModal()">Cancelar</button><button class="guardar" onclick="guardarCarta()">Guardar carta</button></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";

const firebaseConfig={apiKey:"AIzaSyACMTrvEbIEi9OrWCaodEmcGTGcdyVEosE",authDomain:"sorpresa-para-nicole.firebaseapp.com",projectId:"sorpresa-para-nicole",storageBucket:"sorpresa-para-nicole.firebasestorage.app",messagingSenderId:"426658546390",appId:"1:426658546390:web:4d02e56a326f7349957f77"};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const messaging=getMessaging(app);
const VAPID_KEY="BEHcMVftKDotqtt8b3EgpcdxG1DQSaL2yEfLhFMUBqb29V2ET4oPg7H4qyADTc44QG0bAexgLPZaffwStPgcY0Q";
async function activarNotificaciones(){
  if(!("Notification" in window)) return;
  const permiso=await Notification.requestPermission();
  if(permiso!=="granted") return;
  try{const registro=await navigator.serviceWorker.ready; await getToken(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:registro});}catch(e){console.error(e)}
}
window.activarNotificaciones=activarNotificaciones;
onMessage(messaging,()=>{});
const cartasRef=ref(db,"cartasAmor");

const inicio=new Date(2026,2,12,0,0,0);
const cartaInicial={titulo:"Para ti, mi princesa",texto:"Eres la mujer más especial en mi vida, la mujer que a pesar de las peleas y los errores que he cometido nunca se ha ido, te amo infinitamente y espero me perdones porque eres la mujer con la cual me imagino un futuro y cumpliendo todo lo que hemos hablado.\n\nSé que no soy el mejor, pero espero me des la oportunidad de cambiar junto a ti y corregir todos mis errores y defectos, para así por lo menos acercarme al hombre que usted se merece, porque una princesa como usted siempre va a merecer lo mejor.\n\nTe pido perdón por lo que hice y cómo te hice sentir, que aunque no lo hice con mala intención, así lo vio usted. Sé que se puede sentir confundida porque es normal, pero le prometo que si las cosas siguen, mucho va a cambiar y trataré de mejorar en todo lo que pueda.\n\nSé que me pidió un tiempo y no busco presionarla para que tome una decisión, solo quería decirle lo que siento y cuánto la amo, porque desde ayer no paro de pensar en lo que pasó y cómo por una idiotez mía estamos así.\n\nSe lo juro que he llorado porque no la quiero perder y porque me siento como la mierda por hacer sufrir a la mujer que más amo y la que me hizo enamorarme de nuevo."};

let cartasFirebase=[];
let firebaseListo=false;
let modoEliminacion=false;
const CONTRASENA=String.fromCharCode(49,50,48,51,50,54);

function calcularTiempo(){const ahora=new Date();let meses=(ahora.getFullYear()-inicio.getFullYear())*12+(ahora.getMonth()-inicio.getMonth());let fechaMeses=new Date(inicio);fechaMeses.setMonth(inicio.getMonth()+meses);if(fechaMeses>ahora){meses--;fechaMeses=new Date(inicio);fechaMeses.setMonth(inicio.getMonth()+meses)}const dias=Math.floor((ahora-fechaMeses)/86400000);document.getElementById("contador").innerHTML='<div class="grupo"><span class="etiqueta">meses</span><span class="caja-numero">'+meses+'</span></div><span class="separador">y</span><div class="grupo"><span class="etiqueta">días</span><span class="caja-numero">'+dias+'</span></div>'}

window.abrir=function(){
  activarNotificaciones();document.getElementById("inicio").style.display="none";document.getElementById("sorpresa").classList.add("show");renderCartas();setInterval(()=>{let e=document.createElement("span");e.className="float";e.textContent=Math.random()>.5?"💗":"✦";e.style.left=Math.random()*100+"vw";e.style.fontSize=12+Math.random()*15+"px";document.body.appendChild(e);setTimeout(()=>e.remove(),7000)},700)}

function todasLasCartas(){return [cartaInicial,...cartasFirebase]}

function renderCartas(){const cont=document.getElementById("cartas");cont.innerHTML="";todasLasCartas().forEach((c,i)=>{const card=document.createElement("div");card.className="carta-card";card.innerHTML='<span class="corazon-card">💗</span><h3></h3><p></p>';card.querySelector("h3").textContent=c.titulo;card.querySelector("p").textContent=c.texto.substring(0,100)+(c.texto.length>100?"...":"");card.onclick=()=>abrirCarta(i);if(modoEliminacion&&c.id){const b=document.createElement("button");b.className="eliminar-carta";b.textContent="🗑";b.setAttribute("aria-label","Eliminar carta");b.onclick=e=>{e.stopPropagation();eliminarCarta(c.id)};card.appendChild(b)}cont.appendChild(card)})}

function abrirCarta(i){const c=todasLasCartas()[i];document.getElementById("cartas").style.display="none";document.getElementById("lector").classList.add("show");document.getElementById("lectorTitulo").textContent=c.titulo;document.getElementById("lectorTexto").textContent=c.texto}

window.cerrarCarta=function(){document.getElementById("lector").classList.remove("show");document.getElementById("cartas").style.display="grid"}

window.abrirAgregar=function(){const clave=prompt("Contraseña para agregar una carta:");if(clave!==CONTRASENA){if(clave!==null)alert("Contraseña incorrecta.");return}document.getElementById("modal").classList.add("show")};
window.activarEliminacion=function(){const clave=prompt("Contraseña para eliminar cartas:");if(clave!==CONTRASENA){if(clave!==null)alert("Contraseña incorrecta.");return}modoEliminacion=!modoEliminacion;renderCartas();if(modoEliminacion)alert("Modo de eliminación activado. Pulsa la 🗑 de la carta que quieras eliminar.")};
window.eliminarCarta=async function(id){if(!confirm("¿Quieres eliminar esta carta?"))return;try{await remove(ref(db,"cartasAmor/"+id));}catch(error){console.error(error);alert("No se pudo eliminar la carta.")}};

window.guardarCarta=async function(){const titulo=document.getElementById("nuevoTitulo").value.trim();const texto=document.getElementById("nuevoTexto").value.trim();if(!titulo||!texto){alert("Escribe un título y una carta.");return}if(!firebaseListo){alert("Firebase todavía no está listo. Intenta de nuevo en unos segundos.");return}try{await push(cartasRef,{titulo,texto,creadaEn:Date.now()});document.getElementById("nuevoTitulo").value="";document.getElementById("nuevoTexto").value="";cerrarModal()}catch(error){console.error(error);alert("No se pudo guardar la carta. Revisa la configuración de Firebase.");}}

window.cerrarModal=function(){document.getElementById("modal").classList.remove("show")};
window.abrirRecuerdos=function(){const m=document.getElementById("extrasModal"),x=document.getElementById("extrasContenido");x.innerHTML="<h2>Nuestros recuerdos 💗</h2><p style=\"color:#ffffffaa\">Un pequeño lugar para guardar momentos especiales.</p><input id=\"fotoRecuerdo\" type=\"file\" accept=\"image/*\" multiple style=\"width:100%;margin:12px 0\"><div class=\"recuerdos-grid\" id=\"recuerdosGrid\"></div>";m.classList.add("show");const cargar=()=>{const fotos=JSON.parse(localStorage.getItem("recuerdosFotos")||"[]");document.getElementById("recuerdosGrid").innerHTML=fotos.map(src=>"<div class=\"recuerdo\"><img src=\""+src+"\"></div>").join("")};document.getElementById("fotoRecuerdo").onchange=e=>{[...e.target.files].forEach(f=>{const rd=new FileReader();rd.onload=()=>{const fotos=JSON.parse(localStorage.getItem("recuerdosFotos")||"[]");fotos.push(rd.result);localStorage.setItem("recuerdosFotos",JSON.stringify(fotos));cargar()};rd.readAsDataURL(f)});};cargar()};
window.abrirSecretas=function(){const m=document.getElementById("extrasModal"),x=document.getElementById("extrasContenido");x.innerHTML="<h2>Cartas secretas 💗</h2><p style=\"color:#ffffffaa\">Hay cosas que solo se abren con una clave.</p><div class=\"secreta\"><b>Una carta especial</b><br><button class=\"extra-btn\" onclick=\"desbloquearSecreta()\">🔒 Abrir</button></div>";m.classList.add("show")};
window.desbloquearSecreta=function(){const clave=prompt("Escribe la clave para abrir esta carta:");if(clave!=="120326"){if(clave!==null)alert("Esa no es la clave.");return}const x=document.getElementById("extrasContenido");x.innerHTML="<h2>Para ti 💗</h2><p style=\"font-family:Georgia,serif;line-height:1.8\">Esta carta queda guardada para un momento especial. Porque hay palabras que merecen su propio lugar.</p><button class=\"volver\" onclick=\"cerrarExtras()\">Cerrar</button>"};
window.cerrarExtras=function(){document.getElementById("extrasModal").classList.remove("show")};


onValue(cartasRef,(snapshot)=>{const data=snapshot.val()||{};cartasFirebase=Object.entries(data).map(([id,c])=>({...c,id}));firebaseListo=true;renderCartas()},(error)=>{console.error(error);firebaseListo=false;renderCartas()});

calcularTiempo();const dias=Math.floor((new Date()-inicio)/86400000);document.getElementById("diasTotalesInicio").textContent=dias+" días desde aquel 12 de marzo de 2026.";
</script></body></html>
