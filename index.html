<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Para la mujer que más amo</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#090507;color:#fff;font-family:Arial,sans-serif}section{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 18px}.inicio{background:radial-gradient(circle,#3a0b1c,#090507 65%)}h1,h2,h3{font-family:Georgia,serif}.inicio h1{font-size:clamp(42px,8vw,82px);line-height:.95}.btn{border:1px solid #ffffff55;background:#ff406522;color:white;border-radius:50%;width:58px;height:58px;font-size:26px;cursor:pointer;margin:12px;padding:0;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 24px #ff406522}.contador-titulo{font-family:Georgia,serif;font-size:clamp(25px,4vw,34px);font-weight:bold;margin:24px auto 8px}.contador-inicio{margin:0 auto;padding:24px 30px 18px;border:1px solid #ffffff25;border-radius:22px;background:#ffffff0a;backdrop-filter:blur(6px);box-shadow:0 10px 35px #00000055;max-width:560px}.contador-inicio .numero{display:flex;align-items:flex-end;justify-content:center;gap:22px}.contador-inicio .grupo{display:flex;flex-direction:column;align-items:center;gap:9px}.contador-inicio .etiqueta{font-family:Georgia,serif;font-size:19px;color:#ffffffcc;order:-1}.contador-inicio .caja-numero{display:flex;align-items:center;justify-content:center;min-width:82px;padding:13px 18px;border:1px solid #ffffff25;border-radius:16px;background:#ffffff0c;font-family:Georgia,serif;font-size:34px;line-height:1;color:#fff;box-shadow:inset 0 0 18px #00000022}.contador-inicio .separador{font-family:Georgia,serif;font-size:28px;color:#ffffffaa;margin-bottom:10px}.contador-fecha{font-family:Georgia,serif;font-size:15px;color:#ffffffaa;margin-top:18px}.sorpresa{display:none;padding:55px 18px;min-height:100vh;background:radial-gradient(circle at top,#260b18,#090507 60%)}.sorpresa.show{display:block}.wrap{max-width:1000px;margin:auto}.catalogo-titulo{font-size:clamp(34px,6vw,52px);margin:10px 0 8px}.catalogo-subtitulo{color:#ffffffaa;font-family:Georgia,serif;margin:0 0 35px}.cartas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;text-align:left}.carta-card{position:relative;min-height:180px;padding:28px 24px;border:1px solid #ffffff20;border-radius:22px;background:#ffffff0b;box-shadow:0 12px 35px #00000045;cursor:pointer;transition:.25s}.carta-card:hover{transform:translateY(-4px);background:#ffffff12}.carta-card h3{margin:0 0 12px;font-size:25px}.carta-card p{margin:0;color:#ffffffaa;line-height:1.5}.carta-card .corazon-card{position:absolute;right:18px;top:16px;color:#ff668c}.plus-card{display:flex;align-items:center;justify-content:center;min-height:180px;border:1px dashed #ffffff35;border-radius:22px;background:#ffffff05;cursor:pointer;font-family:Georgia,serif;color:#ffffffbb;font-size:20px;transition:.25s}.plus-card:hover{background:#ffffff0c}.plus{font-size:48px;display:block;margin-bottom:4px;color:#ff668c}.lector{display:none;max-width:800px;margin:35px auto 0;padding:35px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff0b;text-align:left}.lector.show{display:block}.lector h2{text-align:center;font-size:38px}.lector p{font-family:Georgia,serif;font-size:18px;line-height:1.8;white-space:pre-line}.volver{display:block;margin:25px auto 0;border:1px solid #ffffff30;background:#ffffff0a;color:white;border-radius:20px;padding:10px 18px;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#000000b8;z-index:10;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{width:min(620px,100%);padding:28px;border:1px solid #ffffff25;border-radius:24px;background:#180b11;box-shadow:0 20px 60px #000}.modal-box h2{margin-top:0;text-align:center}.modal-box input,.modal-box textarea{width:100%;margin:8px 0 14px;padding:13px;border:1px solid #ffffff22;border-radius:12px;background:#ffffff0a;color:white;font:inherit}.modal-box textarea{min-height:180px;resize:vertical}.acciones{display:flex;gap:10px;justify-content:flex-end}.acciones button{border:1px solid #ffffff25;background:#ffffff0b;color:white;border-radius:14px;padding:10px 17px;cursor:pointer}.acciones .guardar{background:#ff406522}.final{text-align:center;padding:70px 20px}.final h3{font-size:clamp(35px,6vw,58px)}.heart{color:#ff668c}.float{position:fixed;bottom:-20px;color:#ff668c;animation:up 7s linear forwards}@keyframes up{to{transform:translateY(-110vh);opacity:0}}
</style></head><body>
<section class="inicio" id="inicio"><div><p>Una pequeña parte de todo lo que siento</p><h1>Para la mujer<br>que más amo <span class="heart">♥</span></h1><button class="btn" onclick="abrir()" aria-label="Abrir sorpresa">💌</button><div class="contador-titulo">Juntos desde hace</div><div class="contador-inicio"><div class="numero" id="contador">Calculando...</div><div class="contador-fecha">12/03/2026</div></div></div></section>

<section class="sorpresa" id="sorpresa"><div class="wrap">
<h1 class="catalogo-titulo">Mis cartas para ti ❤️</h1><p class="catalogo-subtitulo">Cada una guarda algo que quería decirte.</p>
<div class="cartas" id="cartas"></div>
<div class="lector" id="lector"><h2 id="lectorTitulo"></h2><p id="lectorTexto"></p><button class="volver" onclick="cerrarCarta()">← Volver a mis cartas</button></div>
<div class="final"><h3>Te amo sarnosa ❤️</h3></div>
</div></section>

<div class="modal" id="modal"><div class="modal-box"><h2>Agregar una carta ❤️</h2><input id="nuevoTitulo" placeholder="Título de la carta"><textarea id="nuevoTexto" placeholder="Escribe aquí tu carta..."></textarea><div class="acciones"><button onclick="cerrarModal()">Cancelar</button><button class="guardar" onclick="guardarCarta()">Guardar carta</button></div></div></div>

<script>
const inicio=new Date(2026,2,12,0,0,0);
const cartaInicial={titulo:"Para ti, mi princesa",texto:"Eres la mujer más especial en mi vida, la mujer que a pesar de las peleas y los errores que he cometido nunca se ha ido, te amo infinitamente y espero me perdones porque eres la mujer con la cual me imagino un futuro y cumpliendo todo lo que hemos hablado.\n\nSé que no soy el mejor, pero espero me des la oportunidad de cambiar junto a ti y corregir todos mis errores y defectos, para así por lo menos acercarme al hombre que usted se merece, porque una princesa como usted siempre va a merecer lo mejor.\n\nTe pido perdón por lo que hice y cómo te hice sentir, que aunque no lo hice con mala intención, así lo vio usted. Sé que se puede sentir confundida porque es normal, pero le prometo que si las cosas siguen, mucho va a cambiar y trataré de mejorar en todo lo que pueda.\n\nSé que me pidió un tiempo y no busco presionarla para que tome una decisión, solo quería decirle lo que siento y cuánto la amo, porque desde ayer no paro de pensar en lo que pasó y cómo por una idiotez mía estamos así.\n\nSe lo juro que he llorado porque no la quiero perder y porque me siento como la mierda por hacer sufrir a la mujer que más amo y la que me hizo enamorarme de nuevo."};
function calcularTiempo(){const ahora=new Date();let meses=(ahora.getFullYear()-inicio.getFullYear())*12+(ahora.getMonth()-inicio.getMonth());let fechaMeses=new Date(inicio);fechaMeses.setMonth(inicio.getMonth()+meses);if(fechaMeses>ahora){meses--;fechaMeses=new Date(inicio);fechaMeses.setMonth(inicio.getMonth()+meses)}const dias=Math.floor((ahora-fechaMeses)/86400000);document.getElementById("contador").innerHTML='<div class="grupo"><span class="etiqueta">meses</span><span class="caja-numero">'+meses+'</span></div><span class="separador">y</span><div class="grupo"><span class="etiqueta">días</span><span class="caja-numero">'+dias+'</span></div>'}
function abrir(){document.getElementById("inicio").style.display="none";document.getElementById("sorpresa").classList.add("show");renderCartas();setInterval(()=>{let e=document.createElement("span");e.className="float";e.textContent=Math.random()>.5?"♥":"✦";e.style.left=Math.random()*100+"vw";e.style.fontSize=12+Math.random()*15+"px";document.body.appendChild(e);setTimeout(()=>e.remove(),7000)},700)}
function obtenerCartas(){let guardadas=JSON.parse(localStorage.getItem("cartasAmor")||"null");if(!guardadas){guardadas=[cartaInicial];localStorage.setItem("cartasAmor",JSON.stringify(guardadas))}return guardadas}
function renderCartas(){const cont=document.getElementById("cartas");cont.innerHTML="";obtenerCartas().forEach((c,i)=>{const card=document.createElement("div");card.className="carta-card";card.innerHTML='<span class="corazon-card">♥</span><h3></h3><p></p>';card.querySelector("h3").textContent=c.titulo;card.querySelector("p").textContent=c.texto.substring(0,100)+(c.texto.length>100?"...":"");card.onclick=()=>abrirCarta(i);cont.appendChild(card)});const plus=document.createElement("div");plus.className="plus-card";plus.innerHTML='<div><span class="plus">＋</span>Añadir otra carta</div>';plus.onclick=()=>document.getElementById("modal").classList.add("show");cont.appendChild(plus)}
function abrirCarta(i){const c=obtenerCartas()[i];document.getElementById("cartas").style.display="none";document.getElementById("lector").classList.add("show");document.getElementById("lectorTitulo").textContent=c.titulo;document.getElementById("lectorTexto").textContent=c.texto}
function cerrarCarta(){document.getElementById("lector").classList.remove("show");document.getElementById("cartas").style.display="grid"}
function guardarCarta(){const titulo=document.getElementById("nuevoTitulo").value.trim();const texto=document.getElementById("nuevoTexto").value.trim();if(!titulo||!texto){alert("Escribe un título y una carta.");return}const cartas=obtenerCartas();cartas.push({titulo,texto});localStorage.setItem("cartasAmor",JSON.stringify(cartas));document.getElementById("nuevoTitulo").value="";document.getElementById("nuevoTexto").value="";cerrarModal();renderCartas()}
function cerrarModal(){document.getElementById("modal").classList.remove("show")}
calcularTiempo();
</script></body></html>
